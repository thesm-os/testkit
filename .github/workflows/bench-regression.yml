name: Bench Regression

# Runs the bench-regression gate against the committed bench/baseline.txt.
# Fails the PR when benchstat detects a regression beyond noise.
#
# Skipped automatically when bench/baseline.txt is missing — record one
# via `make bench-baseline` from the release branch and commit it.

on:
  pull_request:
    paths:
      - 'bench/**'
      - 'bindings/**'
      - 'generator/bench/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_TIMEOUT: 30m
  # Override locally with: gh workflow run bench-regression.yml -f bench_count=12
  BENCH_COUNT: 6

jobs:
  bench-regression:
    name: Bench regression diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Skip when baseline absent
        id: baseline
        run: |
          if [ ! -f bench/baseline.txt ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::bench/baseline.txt not found — skipping regression check. Record one with 'make bench-baseline' on the release branch."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install benchstat
        if: steps.baseline.outputs.missing == 'false'
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Run bench-regression
        if: steps.baseline.outputs.missing == 'false'
        env:
          BENCH_COUNT: ${{ env.BENCH_COUNT }}
        run: make bench-regression
