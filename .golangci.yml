version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  go: "1.26"
  relative-path-mode: gomod

output:
  show-stats: true
  path-mode: "abs"
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - noinlineerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization / BC
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - noctx
    - perfsprint
    - prealloc
    # Architecture & style
    - decorder
    - depguard
    - dupword
    - forbidigo
    - interfacebloat
    - misspell
    - revive
    - wrapcheck
    - musttag
    - sloglint
    - usestdlibvars
    - nilnil
    - goconst
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    - whitespace
    # Test hygiene
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting

  settings:
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false

    depguard:
      rules:
        core:
          list-mode: strict
          files:
            - "!**/cmd/**"
            - "!**/gen/**"
            - "!**/container/**"
            - "!**/httptest/**"
            - "!**/oteltest/**"
            - "!**/clitest/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - github.com/google/go-cmp
            - pgregory.net/rapid
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/cmd
            - go.thesmos.sh/testkit/gen
            - github.com/google/go-cmp
        gen:
          list-mode: strict
          files:
            - "**/gen/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/gen
            - github.com/google/go-cmp
            - golang.org/x/tools
        container:
          list-mode: strict
          files:
            - "**/container/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/container
            - github.com/google/go-cmp
            - github.com/testcontainers/testcontainers-go
        httptest:
          list-mode: strict
          files:
            - "**/httptest/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/httptest
            - github.com/google/go-cmp
        oteltest:
          list-mode: strict
          files:
            - "**/oteltest/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/oteltest
            - github.com/google/go-cmp
            - go.opentelemetry.io/otel
        clitest:
          list-mode: strict
          files:
            - "**/clitest/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/clitest
            - github.com/google/go-cmp

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "panic() is forbidden in library code; return errors explicitly."
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          msg: "Use structured logging, not fmt.Print*."

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
      ignore-package-globs:
        - go.thesmos.sh/testkit/*

    staticcheck:
      checks:
        - all
        - "-SA1016"
        - "-S1016"

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    interfacebloat:
      max: 10

    asasalint:
      use-builtin-exclusions: true

    copyloopvar:
      check-alias: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test functions are naturally large (table-driven, setup,
      # multi-phase scenarios). Complexity linters add noise.
      - path: '_test\.go'
        linters: [gocognit, maintidx, cyclop, funlen]

      # Test helpers and test files may use panic() for unreachable
      # guards, return (nil, nil) from stubs, and use deterministic
      # math/rand. These are intentional patterns.
      - path: '(_test\.go|testutil/|.*test/)'
        linters: [forbidigo, nilnil, unparam]

      # fieldalignment matters on hot-path production structs.
      # Test infrastructure churn on field additions is noise.
      - path: '(_test\.go|testutil/|.*test/)'
        linters: [govet]
        text: "fieldalignment:"

      # G115: integer overflow on conversion.
      - linters: [gosec]
        text: "G115:"

      # G404: deterministic math/rand is intentional in test infra.
      - path: '(_test\.go|testutil/)'
        linters: [gosec]
        text: "G404:"

      # G302: golden file tests intentionally use 0o644.
      - path: '_test\.go'
        linters: [gosec]
        text: "G302:"

      # cmd/ legitimately uses fmt.Fprint* for CLI output.
      - path: "cmd/"
        linters: [forbidigo]
        text: 'fmt\.(Fprint|Fprintf|Fprintln|Printf)'

      # testutil/ golden file tests cannot be parallelized.
      - path: "testutil/"
        linters: [paralleltest]

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/testkit)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
