version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  go: "1.26"
  relative-path-mode: gomod

output:
  show-stats: true
  path-mode: "abs"
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization / BC
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - noctx
    - perfsprint
    - prealloc
    # Architecture & style
    - decorder
    - depguard
    - dupword
    - forbidigo
    - interfacebloat
    - misspell
    - revive
    - wrapcheck
    - musttag
    - sloglint
    - usestdlibvars
    - nilnil
    - goconst
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    - whitespace
    # Test hygiene
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting

  settings:
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false

    depguard:
      rules:
        # The runtime tier is the module every consumer imports. It stays
        # go-cmp-only: rapid and porcupine belong to the engine module, and an
        # import here would drag them into every consumer's module graph,
        # which is the coupling the module split exists to remove.
        runtime:
          list-mode: strict
          files:
            - "!**/engine/**"
            - "!**/generator/**"
            - "!**/cmd/**"
            - "!**/conformance/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - github.com/google/go-cmp
        # The suite package is the consumer-facing vocabulary inside the
        # engine module: its MODULE home is here (prove's rapid canary is a
        # module-level test dependency), but the PACKAGE stays composable
        # without the property machinery — it may not import the engine's
        # own packages. legs is the one sanctioned bridge, and it lives
        # outside suite/.
        suite-vocabulary:
          list-mode: strict
          files:
            - "**/engine/suite/*.go"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/engine/suite
        # The engine tier owns the heavy verification dependencies. Nothing
        # else in the workspace may import them.
        engine:
          list-mode: strict
          files:
            - "**/engine/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - github.com/google/go-cmp
            - github.com/anishathalye/porcupine
            - pgregory.net/rapid
        # The generator tier owns the codegen substrate. eidos stays here and
        # in the cmd tier: an import from runtime or engine would put a
        # build-time dependency into a consumer's runtime module graph, which
        # is what the module split exists to prevent (docs/adr/0005).
        generator:
          list-mode: strict
          files:
            - "**/generator/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/eidos
            - github.com/google/go-cmp
          # The suite vocabulary — ID grammar, classes, lock rendering — has
          # one home, and the emitter spells it from that home rather than
          # keeping a duplicate grammar in sync by review. What must NOT come
          # with it is the property machinery, and that is a denial rather
          # than a narrower allow: in strict mode a deeper allow entry
          # shadows the broader one, so listing engine/suite beside
          # `go.thesmos.sh/testkit` refused every other intra-testkit import
          # in this module — 89 of them — while still admitting engine/model,
          # which the comment claimed was denied. The rule enforced the
          # opposite of what it said.
          deny:
            - pkg: go.thesmos.sh/testkit/engine/model
              desc: the property machinery is the engine tier's; the generator spells the vocabulary only
        # The conformance tier is the corpus and the gate that checks it. It
        # reads eidos's classification registries directly, because coverage is
        # measured against them rather than declared in a manifest — and the
        # law catalogue in `engine`, because it is the only module that sees
        # the identifiers, the laws and the selection rules at once. That edge
        # is test-only and this module is unpublished, so it costs no consumer
        # anything (docs/adr/0005).
        conformance:
          list-mode: strict
          files:
            - "**/conformance/**"
          allow:
            - $gostd
            # The go/* parsing packages, which $gostd does not expand to —
            # depguard builds that variable from a list the toolchain's own
            # go/... tree is absent from, and the same import is refused under
            # the generator rule for the same reason. Named rather than
            # worked around: the vacuity detector reads the tree's own source
            # to find assertions that cannot fail, and there is no way to do
            # that without a parser.
            - go/ast
            - go/parser
            - go/printer
            - go/token
            - go.thesmos.sh/testkit
            - go.thesmos.sh/eidos
        # The cmd tier is the binary: the generator set plus the CLI framework.
        # It is the only tier permitted to import cobra.
        cmd:
          list-mode: strict
          files:
            - "**/cmd/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - go.thesmos.sh/eidos
            - github.com/spf13/cobra
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "panic() is forbidden in library code; return errors explicitly."
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          msg: "Use structured logging, not fmt.Print*."

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode
        - hugeParam
      settings:
        rangeValCopy:
          sizeThreshold: 256

    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
      ignore-package-globs:
        - go.thesmos.sh/testkit/*

    staticcheck:
      checks:
        - all
        - "-SA1016"
        - "-S1016"

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    interfacebloat:
      max: 10

    asasalint:
      use-builtin-exclusions: true

    copyloopvar:
      check-alias: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test functions are naturally large (table-driven, setup,
      # multi-phase scenarios). Complexity and constant linters add noise.
      - path: '_test\.go'
        linters: [gocognit, maintidx, cyclop, funlen, goconst]

      # Test helpers, test files, and the gen engine may use panic()
      # for unreachable guards, return (nil, nil) from stubs, use
      # deterministic math/rand, and fmt.Sprintf for buffer writing.
      - path: '(_test\.go|testutil/|.*test/)'
        linters: [forbidigo, nilnil, unparam]

      # gen/ engine legitimately uses fmt.Fprintf for buffer writing,
      # fmt.Sprintf for error messages, and fmt.Errorf. When
      # golangci-lint runs from inside gen/, paths are just filenames.
      - path: '(render|write|output|loader|method|directive|errors|imports)\.go'
        linters: [forbidigo]

      # forbidigo's fmt.Print* rule targets console output. Rendering into a
      # strings.Builder is not that, and staticcheck's QF1012 actively
      # requires fmt.Fprintf over WriteString(fmt.Sprintf(...)) — so the two
      # linters disagree unless the buffer-writing case is excluded. The path
      # is unanchored because golangci-lint runs per module, so it sees
      # `gate/coverage.go` rather than the repo-relative path.
      - path: 'gate/coverage\.go'
        linters: [forbidigo]

      # fieldalignment is noise for a test infrastructure library —
      # structs here are not on hot paths.
      - linters: [govet]
        text: "fieldalignment:"

      # G115: integer overflow on conversion.
      - linters: [gosec]
        text: "G115:"

      # G404: deterministic math/rand is intentional in test infra.
      - path: '(_test\.go|testutil/)'
        linters: [gosec]
        text: "G404:"

      # G302: golden file tests intentionally use 0o644.
      - path: '_test\.go'
        linters: [gosec]
        text: "G302:"

      # cmd module legitimately uses fmt.* for CLI output and panic
      # for unreachable guards. When golangci-lint runs per-module
      # from cmd/, paths are relative to the module root.
      - path: "(testkit/|internal/cli/)"
        linters: [forbidigo]

      # testutil/ golden file tests cannot be parallelized.
      - path: "testutil/"
        linters: [paralleltest]

      # The gen/ suite renders its report and lock-file text into a
      # strings.Builder — rendering, not console output, and staticcheck's
      # QF1012 requires fmt.Fprintf there. Paths are module-relative, so
      # from gen/ these are suite/report.go and suite/lock.go.
      - path: 'suite/(report|lock)\.go'
        linters: [forbidigo]

      # The gen/ vocabulary's callback signatures — check bodies, harness
      # constructors, planted-defect closures — take testing.TB as the
      # CHECK'S parameter, not a helper's: a check body's failure must
      # point at its own assertion line, not the runner's call site. And
      # the runner owns leg parallelism (Serial, excused legs), which a
      # static subtest heuristic cannot see.
      - path: "(example/|suite/)"
        linters: [thelper, tparallel, paralleltest]

      # PropT = model.T = rapid.T is a type ALIAS: rapid is part of the
      # property surface by construction, so test files may import it.
      - path: '_test\.go'
        linters: [depguard]
        text: "pgregory.net/rapid"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/testkit)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
