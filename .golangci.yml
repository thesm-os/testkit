version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  go: "1.26"
  relative-path-mode: gomod

output:
  show-stats: true
  path-mode: "abs"
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization / BC
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - noctx
    - perfsprint
    - prealloc
    # Architecture & style
    - decorder
    - depguard
    - dupword
    - forbidigo
    - interfacebloat
    - misspell
    - revive
    - wrapcheck
    - musttag
    - sloglint
    - usestdlibvars
    - nilnil
    - goconst
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    - whitespace
    # Test hygiene
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting

  settings:
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false

    depguard:
      rules:
        # The runtime tier is the module every consumer imports. It stays
        # go-cmp-only: rapid and porcupine belong to the engine module, and an
        # import here would drag them into every consumer's module graph,
        # which is the coupling the module split exists to remove.
        runtime:
          list-mode: strict
          files:
            - "!**/engine/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - github.com/google/go-cmp
        # The engine tier owns the heavy verification dependencies. Nothing
        # else in the workspace may import them.
        engine:
          list-mode: strict
          files:
            - "**/engine/**"
          allow:
            - $gostd
            - go.thesmos.sh/testkit
            - github.com/google/go-cmp
            - github.com/anishathalye/porcupine
            - pgregory.net/rapid
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "panic() is forbidden in library code; return errors explicitly."
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          msg: "Use structured logging, not fmt.Print*."

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode
        - hugeParam
      settings:
        rangeValCopy:
          sizeThreshold: 256

    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
      ignore-package-globs:
        - go.thesmos.sh/testkit/*

    staticcheck:
      checks:
        - all
        - "-SA1016"
        - "-S1016"

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    interfacebloat:
      max: 10

    asasalint:
      use-builtin-exclusions: true

    copyloopvar:
      check-alias: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test functions are naturally large (table-driven, setup,
      # multi-phase scenarios). Complexity and constant linters add noise.
      - path: '_test\.go'
        linters: [gocognit, maintidx, cyclop, funlen, goconst]

      # Test helpers, test files, and the gen engine may use panic()
      # for unreachable guards, return (nil, nil) from stubs, use
      # deterministic math/rand, and fmt.Sprintf for buffer writing.
      - path: '(_test\.go|testutil/|.*test/)'
        linters: [forbidigo, nilnil, unparam]

      # gen/ engine legitimately uses fmt.Fprintf for buffer writing,
      # fmt.Sprintf for error messages, and fmt.Errorf. When
      # golangci-lint runs from inside gen/, paths are just filenames.
      - path: '(render|write|output|loader|method|directive|errors|imports)\.go'
        linters: [forbidigo]

      # fieldalignment is noise for a test infrastructure library —
      # structs here are not on hot paths.
      - linters: [govet]
        text: "fieldalignment:"

      # G115: integer overflow on conversion.
      - linters: [gosec]
        text: "G115:"

      # G404: deterministic math/rand is intentional in test infra.
      - path: '(_test\.go|testutil/)'
        linters: [gosec]
        text: "G404:"

      # G302: golden file tests intentionally use 0o644.
      - path: '_test\.go'
        linters: [gosec]
        text: "G302:"

      # cmd module legitimately uses fmt.* for CLI output and panic
      # for unreachable guards. When golangci-lint runs per-module
      # from cmd/, paths are relative to the module root.
      - path: "(testkit/|internal/cli/)"
        linters: [forbidigo]

      # testutil/ golden file tests cannot be parallelized.
      - path: "testutil/"
        linters: [paralleltest]

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/testkit)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
